name: Deterministic checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: node --test engine.test.js assets.test.js
      - run: python server.test.py
      - run: python agent_backend.test.py
      - run: python agent_api.test.py
      - run: python document_intake.test.py

# Real-model evaluation is separate: it requires a running local Ollama model.
